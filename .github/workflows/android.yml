name: android
on:
  push: { paths: ["android/**", "protocol/**", ".editorconfig", ".github/workflows/android.yml"] }
  pull_request: { paths: ["android/**", "protocol/**", ".editorconfig", ".github/workflows/android.yml"] }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test assembleDebug
      - uses: actions/upload-artifact@v7
        with: { name: app-debug, path: android/app/build/outputs/apk/debug/app-debug.apk }
