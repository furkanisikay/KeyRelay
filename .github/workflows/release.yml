name: release
on:
  push: { branches: [main] }
permissions: { contents: write, issues: write, pull-requests: write }
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
  # Same workflow on purpose: a tag created with GITHUB_TOKEN does not trigger other workflows (docs.github.com "Triggering a workflow from a workflow").
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ needs.release-please.outputs.tag_name }}" }
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: windows/global.json }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: choco install innosetup -y --no-progress
      - run: dotnet test windows/KeyRelay.slnx -c Release
      - run: ./installer/build.ps1
        shell: pwsh
      - run: ./android/gradlew.bat -p android test assembleDebug
      - name: Upload the release assets
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk "KeyRelay-$env:VERSION.apk"
          gh release upload $env:TAG "artifacts/installer/KeyRelay-Setup-$env:VERSION.exe" "artifacts/installer/KeyRelay-$env:VERSION.zip" "KeyRelay-$env:VERSION.apk"
