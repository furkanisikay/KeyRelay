name: release
on:
  push: { tags: ["v*"] }
permissions: { contents: write }
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app versions
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if (-not (Select-String -Path installer/KeyRelay.iss -Pattern "#define AppVersion `"$v`"" -Quiet)) { throw "installer/KeyRelay.iss is not $v" }
          if (-not (Select-String -Path android/app/build.gradle.kts -Pattern "versionName = `"$v`"" -Quiet)) { throw "android versionName is not $v" }
          "VERSION=$v" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: windows/global.json }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: choco install innosetup -y --no-progress
      - run: dotnet test windows/KeyRelay.slnx -c Release
      - run: ./installer/build.ps1
        shell: pwsh
      - run: ./android/gradlew.bat -p android test assembleDebug
      - name: Publish the release
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk "KeyRelay-$env:VERSION.apk"
          gh release create '${{ github.ref_name }}' "artifacts/installer/KeyRelay-Setup-$env:VERSION.exe" "KeyRelay-$env:VERSION.apk" --title "KeyRelay $env:VERSION" --notes-file CHANGELOG.md
